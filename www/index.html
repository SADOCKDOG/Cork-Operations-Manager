<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#a0673a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cork Manager</title>
    <link rel="stylesheet" href="css/styles.css?v=7.0.0">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/app-icon.png">
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Librerías Críticas Locales para Android -->
    
    <!-- Librerías Externas vía CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
</head>
<body>
    <header style="background: var(--bg-card); border-bottom: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        <div class="header-content" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 16px;">
            
            <!-- Left: Logo -->
            <div class="header-logo-container" style="display: flex; align-items: center; flex-shrink: 0;">
                <img src="icons/logo-header.png" id="app-logo" alt="Cork Manager" style="height: 32px; filter: drop-shadow(0 0 6px rgba(204, 255, 0, 0.5));">
            </div>
            
            <!-- Center: Interactive Menu Pill -->
            <div class="header-center-menu" style="display: flex; justify-content: center; align-items: center; position: relative; flex: 1;">
                <button id="header-menu-btn" style="display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(204,255,0,0.1); border: 1px solid rgba(204,255,0,0.3); border-radius: 20px; padding: 6px 16px; color: #CCFF00; cursor: pointer;">
                    <svg id="header-current-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="opacity: 0.7;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div id="header-dropdown" style="display: none; position: absolute; top: 45px; background: #1E1E1E; border: 1px solid #333333; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); width: 160px; z-index: 2000; flex-direction: column; overflow: hidden;">
                    <a href="#/" class="dropdown-item" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #333333; font-size: 0.9rem; font-weight: 600;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: #CCFF00;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg> Inicio
                    </a>
                    <a href="#/lista" class="dropdown-item" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #333333; font-size: 0.9rem; font-weight: 600;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: #4FACFE;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> Lista
                    </a>
                    <a href="#/zonas" class="dropdown-item" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #333333; font-size: 0.9rem; font-weight: 600;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: #F97316;"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon></svg> Zonas
                    </a>
                    <a href="#/informes" class="dropdown-item" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-bottom: 1px solid #333333; font-size: 0.9rem; font-weight: 600;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: #FFD700;"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg> Informes
                    </a>
                    <a href="#/ajustes" class="dropdown-item" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="color: #94A3B8;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Ajustes
                    </a>
                </div>
            </div>
            
            <!-- Right: Active Farm -->
            <div id="finca-header-info" style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-shrink: 0; max-width: 35%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 4px 10px; border-radius: 12px;">
                <div style="width: 8px; height: 8px; background: #CCFF00; border-radius: 50%; box-shadow: 0 0 8px rgba(204, 255, 0, 0.5); flex-shrink: 0;"></div>
                <span id="nombre-finca-header" style="color: #FFFFFF; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Cargando...</span>
            </div>

        </div>
    </header>

    <main id="app-content">
        <div class="loader">Iniciando aplicación...</div>
    </main>

    <nav class="bottom-nav compact">
        <a href="#/" class="nav-item" id="nav-home" aria-label="Ir al inicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span class="label">Inicio</span>
        </a>
        <a href="#/lista" class="nav-item" id="nav-lista">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            <span class="label">Lista</span>
        </a>
        <a href="#/zonas" class="nav-item" id="nav-zonas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
            <span class="label">Zonas</span>
        </a>
        <a href="#/informes" class="nav-item" id="nav-informes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
            <span class="label">Informes</span>
        </a>
        <a href="#/ajustes" class="nav-item" id="nav-ajustes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span class="label">Ajustes</span>
        </a>
    </nav>

    <button class="fab fab-pulse" id="fab-nueva" aria-label="Nueva pesada" data-route="/nueva">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="28" height="28"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <div id="toast-container"></div>

    <script type="module" src="js/app.js"></script>

    <script>
        window.isNative = (typeof window.Capacitor !== 'undefined');
        window.onerror = function(msg, url, line) {
            alert("Error: " + msg + "\nLínea: " + line);
            return false;
        };
    </script>
</body>
</html>
